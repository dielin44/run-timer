name: Publish APK Release
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v3.5.0 >/dev/null
