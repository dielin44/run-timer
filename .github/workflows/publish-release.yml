name: Publish APK Release
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v3.0.0 >/dev/null 2>&1 || gh release create v3.0.0 releases/RunTimer-v3.0.0.apk --title "跑單計時器 3.0.0" --notes "新增背景高精度 GPS、卡片循環不限單、滾動趟次、取餐送達確認、取消原因與收入、合併預估拆分及違法紅字警示。"
