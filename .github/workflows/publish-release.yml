name: Publish APK Release
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v3.1.0 >/dev/null 2>&1 || gh release create v3.1.0 releases/RunTimer-v3.1.0.apk --title "跑單計時器 3.1.0" --notes "新增成果圖片與 Excel .xlsx 匯出，可依選定日期保存完整趟次、訂單、費用、時間、里程、取消收入及違法警示。"
