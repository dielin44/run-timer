name: Publish APK Release
on:
  push:
    branches: [main]
    paths:
      - "releases/RunLion-v3.10.7.apk"
      - ".github/workflows/publish-release.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify APK
        run: |
          cp releases/RunLion-v3.10.7.apk RunLion-v3.10.7.apk
          echo "8e802b88e6690b174407353a1b0c364e431c6729d36b461da854afdd5761cd92 RunLion-v3.10.7.apk" | sha256sum --check -
      - name: Create public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v3.10.7 >/dev/null 2>&1; then
            gh release upload v3.10.7 RunLion-v3.10.7.apk --clobber
            gh release edit v3.10.7 --title "跑單大獅 3.10.7" --notes-file .release-input/v3.10.7/RELEASE_NOTES.md
          else
            gh release create v3.10.7 RunLion-v3.10.7.apk --target "$GITHUB_SHA" --title "跑單大獅 3.10.7" --notes-file .release-input/v3.10.7/RELEASE_NOTES.md
          fi
