name: Publish APK Release

on:
  push:
    branches: [main]
    paths:
      - ".release-input/v3.8.3/**"
      - ".github/workflows/publish-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and verify APK
        run: |
          cat .release-input/v3.8.3/part-* | base64 --decode > RunLion-v3.8.3.apk
          echo "7842534115a8d42a94083e4fcdb036311b1c42a113e91ad7c02445cf349dd030 RunLion-v3.8.3.apk" | sha256sum --check -
      - name: Keep public raw download
        run: |
          mkdir -p releases
          cp RunLion-v3.8.3.apk releases/RunLion-v3.8.3.apk
          git add releases/RunLion-v3.8.3.apk
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Add RunLion v3.8.3 APK"
            git push
          fi
      - name: Create public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v3.8.3 >/dev/null 2>&1; then
            gh release upload v3.8.3 RunLion-v3.8.3.apk --clobber
            gh release edit v3.8.3 --title "跑單大獅 3.8.3" --notes-file .release-input/v3.8.3/RELEASE_NOTES.md
          else
            gh release create v3.8.3 RunLion-v3.8.3.apk --target main --title "跑單大獅 3.8.3" --notes-file .release-input/v3.8.3/RELEASE_NOTES.md
          fi
