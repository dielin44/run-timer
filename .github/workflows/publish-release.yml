name: Publish APK Release
on:
  push:
    branches: [main]
    paths:
      - ".release-input/v3.18.3/**"
      - ".github/workflows/publish-release.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify completed APK
        run: |
          cat .release-input/v3.18.3/apk-parts/part*.bin > RunLion-v3.18.3.apk
          echo "3c41f09a07da8247080615b6d5f3d84796dc48ae09ea28adbe2779025e9949c7  RunLion-v3.18.3.apk" | sha256sum --check -
          python3 -m zipfile -t RunLion-v3.18.3.apk
      - name: Publish public download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v3.18.3 >/dev/null 2>&1; then
            gh release upload v3.18.3 RunLion-v3.18.3.apk --clobber
          else
            gh release create v3.18.3 RunLion-v3.18.3.apk --draft --target "$GITHUB_SHA" --title "跑單大獅 3.18.3" --notes-file .release-input/v3.18.3/RELEASE_NOTES.md
          fi
          gh release edit v3.18.3 --draft=false --latest --title "跑單大獅 3.18.3" --notes-file .release-input/v3.18.3/RELEASE_NOTES.md
