name: Publish APK Release
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v2.5.1 >/dev/null 2>&1 || gh release create v2.5.1 releases/RunTimer-v2.5.1.apk --title "跑單計時器 2.5.1" --notes "熊貓費用進單時由 0 元開始，送達後才加入 30 元基本費；成果理想費用不低於預計總額。"
