name: Publish APK Release
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v2.4.0 >/dev/null 2>&1 || gh release create v2.4.0 releases/RunTimer-v2.4.apk --title "跑單計時器 2.4.0" --notes "跑單計時器 Android 公開下載版。支援疊單計時、31天成果、預計金額與專法金額比較。"
