name: Publish APK Release
on:
  push:
    branches: [main]
    paths:
      - ".release-input/v3.18.4/**"
      - ".github/workflows/publish-release.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v3.18.3 --pattern RunLion-v3.18.3.apk --dir base-release
          python3 .release-input/v3.18.4/reconstruct_apk.py base-release/RunLion-v3.18.3.apk RunLion-v3.18.4.apk
          echo "833f9d7c4fe4bcb1d5ada67323b7f1c3b271d3dbb582cb01db60454d1324ee65  RunLion-v3.18.4.apk" | sha256sum --check -
          python3 -m zipfile -t RunLion-v3.18.4.apk
      - name: Publish public download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v3.18.4 >/dev/null 2>&1; then
            gh release upload v3.18.4 RunLion-v3.18.4.apk .release-input/v3.18.4/RunLion-v3.18.4-patch-kit.zip --clobber
          else
            gh release create v3.18.4 RunLion-v3.18.4.apk .release-input/v3.18.4/RunLion-v3.18.4-patch-kit.zip --draft --target "$GITHUB_SHA" --title "跑單大獅 3.18.4" --notes-file .release-input/v3.18.4/RELEASE_NOTES.md
          fi
          gh release edit v3.18.4 --draft=false --latest --title "跑單大獅 3.18.4" --notes-file .release-input/v3.18.4/RELEASE_NOTES.md
