name: Publish APK Release

on:
  push:
    branches: [main]
    paths:
      - ".release-input/v3.8.8/**"
      - ".github/workflows/publish-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and verify APK
        run: |
          cat .release-input/v3.8.8/part-* | base64 --decode > RunLion-v3.8.8.apk
          echo "4b166d1b8a9cfbd88115b436d82fa5a7b48b17fa1f18f835c5c79c188ba5cc63 RunLion-v3.8.8.apk" | sha256sum --check -
      - name: Keep public raw download
        run: |
          mkdir -p releases
          cp RunLion-v3.8.8.apk releases/RunLion-v3.8.8.apk
          git add releases/RunLion-v3.8.8.apk
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Add RunLion v3.8.8 APK"
            git push
          fi
      - name: Create public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v3.8.8 >/dev/null 2>&1; then
            gh release upload v3.8.8 RunLion-v3.8.8.apk --clobber
            gh release edit v3.8.8 --title "跑單大獅 3.8.8" --notes-file .release-input/v3.8.8/RELEASE_NOTES.md
          else
            gh release create v3.8.8 RunLion-v3.8.8.apk --target main --title "跑單大獅 3.8.8" --notes-file .release-input/v3.8.8/RELEASE_NOTES.md
          fi
