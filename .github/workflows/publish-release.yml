name: Publish APK Release
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v3.2.0 >/dev/null 2>&1 || gh release create v3.2.0 releases/RunTimer-v3.2.0.apk --title "跑單計時器 3.2.0" --notes "取消時只記錄原因，不再立即詢問收入；平台報酬確定後，可在成果表直接補登每張取消訂單的收入，並同步至圖片與 Excel 匯出。"
