name: Publish APK Release
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v2.5.0 >/dev/null 2>&1 || gh release create v2.5.0 releases/RunTimer-v2.5.apk --title "跑單計時器 2.5.0" --notes "新增 GPS 實際里程追蹤、取餐與送餐分段、熊貓里程費用、每公里費用及理想費用。"
